[project]
name = "sak-agripolicies"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-docling>=3.0.0",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "pandas>=3.1.1",
    "pymupdf4llm>=2.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "tqdm>=4.70.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "docling-slim[feat-ocr-rapidocr,format-pdf-docling,models-local]>=2.152.0",
    "opencv-python-headless>=4.6",
    "onnxruntime-gpu>=1.32.0",
    "langchain-community>=0.4.2",
    "rank-bm25>=0.2.2",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.28.0",
    "fastapi>=0.110.0"
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
